name: deploy dashboard

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-dashboard.yml"
      - "data/scrapverse.db"
      - "pyproject.toml"
      - "uv.lock"
      - "src/**"
      - "targets.toml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --frozen

      # Deployment never runs collectors or heals: it renders the committed
      # history only, so publishing cannot mutate a Bright Data scraper.
      - run: uv run dr-browser report -o site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
